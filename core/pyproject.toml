[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuegrid"
version = "0.1.0"
description = "Grid-Guided Phrase Analysis: analyzes audio and injects automated HotCues into Traktor Pro's collection.nml"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "mutagen>=1.47",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
cuegrid = "cuegrid.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
